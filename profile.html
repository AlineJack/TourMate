<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  (function () {
    var theme = localStorage.getItem("tourmate_theme") === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — TourMate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%2314313A'/%3E%3Cpath d='M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z' fill='%23EFA23D'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="dashboard.html" class="brand">
      <svg viewBox="0 0 24 24" class="brand-mark" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10.2" fill="none" stroke="#14313A" stroke-width="1.6"/>
        <path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" fill="#EFA23D"/>
      </svg>
      TourMate
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links">
      <a href="dashboard.html" data-page="dashboard">Dashboard</a>
      <a href="explore.html" data-page="explore">Explore</a>
      <a href="planner.html" data-page="planner">Tour Planner</a>
      <a href="experiences.html" data-page="experiences">Experiences</a>
      <a href="checklist.html" data-page="checklist">Checklist</a>
      <a href="profile.html" data-page="profile">Profile</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle-btn" data-theme-toggle type="button" aria-label="Toggle dark mode">🌙</button>
      <span class="nav-user" data-nav-user></span>
      <button class="btn btn-ghost btn-sm" data-logout type="button">Log out</button>
    </div>
  </div>
</header>

<main class="page-main">
  <div class="container profile-wrap">
    <div class="card profile-card fade-in">
      <div class="avatar-circle" id="avatarCircle">?</div>
      <h1 class="profile-name" id="profileName">—</h1>
      <div class="profile-email" id="profileEmail">—</div>

      <div id="guestNote" class="guest-note" style="display:none;">
        You're browsing as a guest. Create a account to keep this device's trips tied to an email and password.
      </div>

      <!-- View mode -->
      <div id="profileViewMode">
        <div class="profile-details">
          <div class="profile-detail">
            <div class="profile-detail-label">Bio</div>
            <div class="profile-detail-value" id="profileBioView">Not set</div>
          </div>
          <div class="profile-detail">
            <div class="profile-detail-label">Gender</div>
            <div class="profile-detail-value" id="profileGenderView">Not set</div>
          </div>
          <div class="profile-detail">
            <div class="profile-detail-label">Home address</div>
            <div class="profile-detail-value" id="profileAddressView">Not set</div>
          </div>
        </div>

        <div class="profile-stats">
          <div>
            <div class="stat-value" id="profilePlanCount">0</div>
            <div class="stat-label">Saved plans</div>
          </div>
        </div>

        <button class="btn btn-outline btn-block" id="editProfileBtn" type="button">Edit profile</button>
        <button class="btn btn-outline btn-block" id="profileLogoutBtn" type="button" style="margin-top:10px;">Log out</button>
        <a href="login.html?tab=register" class="btn btn-primary btn-block" id="createAccountBtn" style="display:none;margin-top:10px;">Create free account</a>
      </div>

      <!-- Edit mode -->
      <form class="profile-form" id="profileForm" style="display:none;" novalidate>
        <div class="form-message" id="profileFormMessage"></div>

        <div class="field">
          <label for="profileNameInput">Full name</label>
          <input type="text" id="profileNameInput" autocomplete="name" placeholder="Your name" />
          <div class="field-error" id="profileNameError"></div>
        </div>

        <div class="field">
          <label for="profileBioInput">Bio</label>
          <textarea id="profileBioInput" placeholder="A little about you and how you like to travel"></textarea>
          <div class="field-error" id="profileBioError"></div>
        </div>

        <div class="field">
          <label for="profileGenderInput">Gender</label>
          <select id="profileGenderInput">
            <option value="">Prefer not to say</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </div>

        <div class="field">
          <label for="profileAddressInput">Home address</label>
          <input type="text" id="profileAddressInput" autocomplete="street-address" placeholder="City, country" />
          <div class="field-error" id="profileAddressError"></div>
        </div>

        <div class="profile-form-actions">
          <button type="button" class="btn btn-outline" id="cancelEditBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save changes</button>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">TourMate</div>
</footer>

<!-- Firebase SDK (compat build — works with plain <script> tags, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script src="js/storage.js"></script>
<script src="js/tour-store.js"></script>
<script src="js/experience-store.js"></script>
<script src="js/profile-store.js"></script>
<script src="js/settings-store.js"></script>
<script src="js/roles.js"></script>
<script src="js/app.js"></script>
<script src="js/destinations.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
