<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in or sign up — TourMate</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%2314313A'/%3E%3Cpath d='M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z' fill='%23EFA23D'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 24 24" class="brand-mark" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="10.2" fill="none" stroke="#14313A" stroke-width="1.6"/>
        <path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" fill="#EFA23D"/>
      </svg>
      TourMate
    </a>
    <nav class="nav-links" style="position:static;display:flex;box-shadow:none;padding:0;border:none;">
      <a href="index.html">Back to home</a>
    </nav>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card fade-in">
    <div class="auth-tabs">
      <button class="auth-tab" id="tabLoginBtn" type="button">Log in</button>
      <button class="auth-tab" id="tabRegisterBtn" type="button">Create account</button>
    </div>

    <!-- Login form -->
    <form class="auth-form" id="loginForm" novalidate>
      <div class="form-message error" id="loginMessage"></div>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="email" placeholder="you@example.com" required />
        <div class="field-error" id="loginEmailError"></div>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••" required />
        <div class="field-error" id="loginPasswordError"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <!-- Register form -->
    <form class="auth-form" id="registerForm" novalidate>
      <div class="form-message error" id="registerMessage"></div>
      <div class="field">
        <label for="registerName">Full name</label>
        <input type="text" id="registerName" autocomplete="name" placeholder="Your name" required />
        <div class="field-error" id="registerNameError"></div>
      </div>
      <div class="field">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" autocomplete="email" placeholder="you@example.com" required />
        <div class="field-error" id="registerEmailError"></div>
      </div>
      <div class="field">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" autocomplete="new-password" placeholder="At least 6 characters" required />
        <div class="field-error" id="registerPasswordError"></div>
      </div>
      <div class="field">
        <label for="registerConfirm">Confirm password</label>
        <input type="password" id="registerConfirm" autocomplete="new-password" placeholder="••••••••" required />
        <div class="field-error" id="registerConfirmError"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <div class="auth-divider">or</div>
    <button class="btn btn-outline btn-block" id="guestBtn" type="button">Continue as guest</button>
  </div>
</main>

<!-- Firebase SDK (compat build — works with plain <script> tags, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
